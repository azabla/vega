# Production stack. Run on the server from the repo root:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Only "web" is published, and only on 127.0.0.1 — the host's Nginx (which also
# serves other sites and holds the SSL certificates) forwards the domain to it.
name: vega-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vega
      POSTGRES_USER: vega
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vega -d vega"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2} --timeout 60 --access-logfile - --error-logfile -
    env_file: .env.prod
    environment:
      DEBUG: "False"
      SITE_URL: https://${DOMAIN}  # portfolio link in QR codes and CV PDFs
      BASE_DOMAIN: ${DOMAIN}       # <username>.${DOMAIN} once PORTFOLIO_SUBDOMAINS=true (docs/15)
      DATABASE_URL: postgres://vega:${POSTGRES_PASSWORD}@db:5432/vega
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/testview/', headers={'Host': '${DOMAIN}'}), timeout=5)"
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: /api
        # set: "/" shows this user's portfolio; empty: "/" is the landing page with signup
        VITE_PORTFOLIO_USERNAME: ${PORTFOLIO_USERNAME:-}
        VITE_BASE_DOMAIN: ${DOMAIN}
        VITE_PORTFOLIO_SUBDOMAINS: ${PORTFOLIO_SUBDOMAINS:-false}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8010}:80"
    volumes:
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      backend:
        condition: service_healthy

  # Optional HTTPS edge for portfolio subdomains and owners' own domains (docs/15). Caddy gets a
  # certificate per host on first visit, after asking the backend whether the host is ours.
  # It needs ports 80/443, so it replaces the host Nginx for these domains:
  #   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile edge up -d
  edge:
    image: caddy:2.10-alpine
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # to reach the host's other sites (see Caddyfile)
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  media:
  static:
  caddy_data:
  caddy_config:
