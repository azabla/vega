# Nginx inside the "web" container (production).
# Serves the React build, Django static/media files, and proxies /api and /admin
# to the backend container. The host Nginx in front of it terminates HTTPS.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # The host Nginx sets X-Forwarded-Proto/For; pass them on so Django knows
    # the original request was HTTPS and who the client was.
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
    }

    # Hashed bundles never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: every other path is an app route
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
