# Local development stack: Postgres + Django (runserver) + Vite
#   docker compose up --build
# Host ports can be changed if taken: BACKEND_PORT=8001 docker compose up
name: vega-portfolio  # unique name so other projects' builds don't re-tag our images

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vega
      POSTGRES_USER: vega
      POSTGRES_PASSWORD: vega
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vega -d vega"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-only-not-secret
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # Always the local container DB, never the one in backend/.env
      DATABASE_URL: postgres://vega:vega@db:5432/vega
    volumes:
      - ./backend:/app
      - /app/env  # hide the host virtualenv from the container
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}/api
      VITE_PORTFOLIO_USERNAME: ${PORTFOLIO_USERNAME:-vega}
    volumes:
      - ./frontend:/app
      - /app/node_modules  # keep the container's node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
