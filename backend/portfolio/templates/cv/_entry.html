<article class="entry">
  <div class="entry-head">
    <h3>{{ e.title }}{% if e.org %} <span class="org">· {{ e.org }}</span>{% endif %}</h3>
    {% if e.when %}<p class="when">{{ e.when }}</p>{% endif %}
  </div>
  {% if e.body.bullets %}
    <div class="body"><ul>{% for b in e.body.bullets %}<li>{{ b }}</li>{% endfor %}</ul></div>
  {% elif e.body.text %}
    <div class="body"><p>{{ e.body.text }}</p></div>
  {% endif %}
</article>
