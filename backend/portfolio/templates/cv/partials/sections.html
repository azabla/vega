{% comment %}Renders `list` (sections from cv/context.py); area="side" in the sidebar. The title's <span> lets templates style it; id="cv-<id>" lets the editor find it in the preview.{% endcomment %}
{% for s in list %}
  <section id="cv-{{ s.id }}" class="sec sec-{{ s.kind }} sec-in-{{ area|default:'main' }}{% if s.columns == 2 %} sec-cols-2{% endif %}{% if s.page_break %} sec-break{% endif %}">
    <h2 class="sec-title"><span>{{ s.title }}</span></h2>
    <div class="sec-body">{% include s.partial with d=s.data %}</div>
  </section>
{% endfor %}
