# HOST Nginx site for andu.aetechsolution.et (the same Nginx that serves the Laravel site).
# It only forwards the domain to the Vega "web" container on 127.0.0.1:8010.
# Install: /etc/nginx/sites-available/andu.aetechsolution.et → symlink into sites-enabled.
# Certbot adds the HTTPS (443) block and the http→https redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name andu.aetechsolution.et;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
