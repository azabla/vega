# Nginx site for the Vega portfolio.
# Install: /etc/nginx/sites-available/andu.aetechsolution.et  (then symlink into sites-enabled)
# Certbot adds the HTTPS (443) block and the http→https redirect to this file.

upstream vega_backend {
    server 127.0.0.1:8010;   # Gunicorn (see vega.service). Only reachable from the server itself.
}

server {
    listen 80;
    listen [::]:80;
    server_name andu.aetechsolution.et;

    # React build output: index.html + /assets/*
    root /var/www/vega/frontend/dist;
    index index.html;

    client_max_body_size 20M;   # image / CV uploads through the admin

    # Django: API and admin
    location /api/ {
        proxy_pass http://vega_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://vega_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files (admin CSS/JS), produced by `collectstatic`
    location /static/ {
        alias /var/www/vega/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Uploaded files (project images, CV, logos)
    location /media/ {
        alias /var/www/vega/backend/media/;
        expires 7d;
    }

    # Hashed frontend bundles never change: cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is a React route (/u/vega, /projects/...): serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
